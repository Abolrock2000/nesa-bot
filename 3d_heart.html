<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 3D Love Heart - Ahu Goozlum 💖</title>
<style>
* {
    margin: 0;
    padding: 0;
    background: #0a0a0a;
    overflow: hidden;
}
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    perspective: 1000px;
}
.heart-container {
    position: relative;
    width: 400px;
    height: 400px;
    transform-style: preserve-3d;
    animation: spin 12s linear infinite;
}
@keyframes spin {
    0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
    100% { transform: rotateX(360deg) rotateY(720deg) rotateZ(360deg); }
}
.word {
    position: absolute;
    color: #ff2244;
    font-family: 'Arial', sans-serif;
    font-size: 11px;
    font-weight: bold;
    text-shadow: 0 0 5px #ff2244, 0 0 15px #ff2244, 0 0 30px #ff4466;
    animation: pulse 2s ease-in-out infinite alternate;
    user-select: none;
    white-space: nowrap;
    transform: translate(-50%, -50%);
}
@keyframes pulse {
    0% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.8); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
}
.center-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ff2244;
    font-family: 'Arial Black', sans-serif;
    font-size: 38px;
    font-weight: 900;
    text-shadow: 0 0 20px #ff2244, 0 0 40px #ff2244, 0 0 60px #ff4466, 0 0 80px #ff6688;
    z-index: 10;
    text-align: center;
    animation: centerPulse 1.5s ease-in-out infinite alternate;
    letter-spacing: 2px;
    background: transparent;
    pointer-events: none;
}
.center-text span {
    display: block;
    font-size: 18px;
    color: #ff6699;
    font-family: 'Arial', sans-serif;
    font-weight: normal;
    text-shadow: 0 0 10px #ff6699, 0 0 20px #ff6699;
    margin-top: 5px;
}
@keyframes centerPulse {
    0% { transform: translate(-50%, -50%) scale(0.95); text-shadow: 0 0 20px #ff2244, 0 0 40px #ff2244; }
    100% { transform: translate(-50%, -50%) scale(1.05); text-shadow: 0 0 30px #ff2244, 0 0 60px #ff4466, 0 0 80px #ff6688; }
}
@media (max-width: 550px) {
    .heart-container { width: 280px; height: 280px; }
    .word { font-size: 8px; }
    .center-text { font-size: 24px; }
    .center-text span { font-size: 14px; }
}
</style>
</head>
<body>
<div class="heart-container" id="heartContainer">
    <div class="center-text">
        ❤️ ahu goozlum ❤️
        <span>i love you forever</span>
    </div>
</div>

<script>
const container = document.getElementById('heartContainer');
const text = "i love you";
const rows = 34, cols = 30;

function isInsideHeart(x, y) {
    const nx = x * 0.065;
    const ny = y * 0.065;
    const a = nx*nx + ny*ny - 1;
    return a*a*a - nx*nx * ny*ny*ny <= 0;
}

const points = [];
for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
        const x = (col / cols) * 2 - 1;
        const y = (row / rows) * 2 - 1;
        if (isInsideHeart(x, y)) {
            const px = (x + 1) / 2 * 100;
            const py = (1 - y) / 2 * 100;
            const size = 8 + Math.random() * 7;
            const delay = Math.random() * 3;
            const opacity = 0.5 + Math.random() * 0.5;
            points.push({px, py, size, delay, opacity});
        }
    }
}

points.forEach((p, i) => {
    const word = document.createElement('span');
    word.className = 'word';
    word.textContent = text;
    word.style.left = p.px + '%';
    word.style.top = p.py + '%';
    word.style.fontSize = p.size + 'px';
    word.style.animationDelay = p.delay + 's';
    word.style.opacity = p.opacity;
    const rotX = Math.random() * 360;
    const rotY = Math.random() * 360;
    const rotZ = Math.random() * 360;
    word.style.transform = `translate(-50%, -50%) rotateX(${rotX}deg) rotateY(${rotY}deg) rotateZ(${rotZ}deg)`;
    container.appendChild(word);
});

let time = 0;
setInterval(() => {
    time += 0.03;
    document.querySelectorAll('.word').forEach((word, i) => {
        const delay = i * 0.005;
        const wave = Math.sin(time + delay) * 0.3 + 0.7;
        word.style.opacity = wave;
        const s = 0.9 + Math.sin(time * 0.5 + i * 0.01) * 0.1;
        word.style.transform = word.style.transform.replace(/scale\([^)]*\)/, '') + ` scale(${s})`;
    });
}, 50);
</script>
</body>
</html>
